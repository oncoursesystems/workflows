name: sentry-fix

# Three jobs keep each secret where it is needed. plan reads Sentry and GitHub. fix holds only the Claude OAuth
# token, and runs the agent and the project commands in throwaway Docker containers, because those commands
# execute repository code the fixer can change. publish holds the bot and Sentry tokens and runs none of that
# code. See the Security section of docs/sentry-fix.md for what the containers isolate and what they do not.

on:
  workflow_call:
    inputs:
      config-path:
        description: Path of the sentry-fix config, read from the default branch
        type: string
        default: .github/sentry-fix.yml
      dry-run:
        description: Print the walk to the job summary, and run no fixer, open no pull request and post no note
        type: boolean
        default: false
      runs-on:
        description: Runner label for every job. The fix job needs Docker with buildx on it.
        type: string
        default: linux
      node-version:
        description: Node.js version the project commands need, as a major or an exact version. Defaults to 24.
        type: string
        default: ''
      dotnet-version:
        description: .NET SDK image tag the project commands need, such as 10.0. Defaults to 10.0.
        type: string
        default: ''
      global-json-file:
        description: global.json in the checkout that names the .NET SDK the project commands need
        type: string
        default: ''
      fix-image:
        description: An image to run the fixer in instead of the one built from the sentry-fix-run Dockerfile
        type: string
        default: ''
      sentry-org:
        description: Sentry organization slug
        type: string
        required: true
      bot-client-id:
        description: Client ID of the GitHub App that opens the pull requests
        type: string
        required: true
    secrets:
      sentry-token:
        required: true
      typesafe-api-key:
        required: true
      claude-code-oauth-token:
        required: true
      bot-app-private-key:
        required: true

permissions: {}

jobs:
  plan:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      issues: ${{ steps.plan.outputs.issues }}
      count: ${{ steps.plan.outputs.count }}
      sha: ${{ steps.plan.outputs.sha }}
      plan-sha256: ${{ steps.plan.outputs.plan-sha256 }}
    steps:
      - name: Plan the issues to attempt
        id: plan
        uses: oncoursesystems/workflows/.github/actions/sentry-fix-plan@main
        with:
          github-token: ${{ github.token }}
          sentry-token: ${{ secrets.sentry-token }}
          sentry-org: ${{ inputs.sentry-org }}
          typesafe-api-key: ${{ secrets.typesafe-api-key }}
          config-path: ${{ inputs.config-path }}
          dry-run: ${{ inputs.dry-run }}
          plan-dir: ${{ runner.temp }}/sentry-fix-plan

      - name: Keep the plan for the fix and publish jobs
        if: steps.plan.outputs.count != '' && steps.plan.outputs.count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: sentry-fix-plan
          path: ${{ runner.temp }}/sentry-fix-plan/plan.json
          if-no-files-found: error
          retention-days: 14

  fix:
    needs: plan
    if: needs.plan.outputs.count != '' && needs.plan.outputs.count != '0'
    name: fix ${{ matrix.issue.shortId }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        issue: ${{ fromJSON(needs.plan.outputs.issues) }}
    steps:
      - name: Check out the planned commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Download the plan
        uses: actions/download-artifact@v8
        with:
          name: sentry-fix-plan
          path: ${{ runner.temp }}/sentry-fix-plan

      - name: Fix the issue
        uses: oncoursesystems/workflows/.github/actions/sentry-fix-run@main
        with:
          plan-file: ${{ runner.temp }}/sentry-fix-plan/plan.json
          plan-sha256: ${{ needs.plan.outputs.plan-sha256 }}
          issue-id: ${{ matrix.issue.id }}
          out-dir: ${{ runner.temp }}/sentry-fix/${{ matrix.issue.id }}
          claude-code-oauth-token: ${{ secrets.claude-code-oauth-token }}
          node-version: ${{ inputs.node-version }}
          dotnet-version: ${{ inputs.dotnet-version }}
          global-json-file: ${{ inputs.global-json-file }}
          fix-image: ${{ inputs.fix-image }}

      - name: Keep the result for the publish job
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sentry-fix-result-${{ matrix.issue.id }}
          path: ${{ runner.temp }}/sentry-fix/${{ matrix.issue.id }}
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [plan, fix]
    if: ${{ !cancelled() && needs.plan.outputs.count != '' && needs.plan.outputs.count != '0' }}
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - name: Download the plan
        uses: actions/download-artifact@v8
        with:
          name: sentry-fix-plan
          path: ${{ runner.temp }}/sentry-fix-plan

      - name: Download the fixer results
        uses: actions/download-artifact@v8
        with:
          pattern: sentry-fix-result-*
          path: ${{ runner.temp }}/sentry-fix

      - name: Publish the results
        uses: oncoursesystems/workflows/.github/actions/sentry-fix-publish@main
        with:
          plan-file: ${{ runner.temp }}/sentry-fix-plan/plan.json
          plan-sha256: ${{ needs.plan.outputs.plan-sha256 }}
          results-dir: ${{ runner.temp }}/sentry-fix
          bot-client-id: ${{ inputs.bot-client-id }}
          bot-app-private-key: ${{ secrets.bot-app-private-key }}
          sentry-token: ${{ secrets.sentry-token }}
          sentry-org: ${{ inputs.sentry-org }}
          config-path: ${{ inputs.config-path }}
