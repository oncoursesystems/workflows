name: sentry-fix

# Three jobs keep each secret where it is needed. plan reads Sentry and GitHub. fix runs Claude on the checkout
# and holds only the Claude credentials, because the project commands it runs execute repository code that the
# fixer can change. publish runs on a fresh runner with the bot and Sentry tokens and never runs that code.

on:
  workflow_call:
    inputs:
      config-path:
        description: Path of the sentry-fix config, read from the default branch
        type: string
        default: .github/sentry-fix.yml
      dry-run:
        description: Print the walk to the job summary, and run no fixer, open no pull request and post no note
        type: boolean
        default: false
      runs-on:
        description: Runner label for every job
        type: string
        default: linux
      node-version:
        description: Node.js version the project commands need
        type: string
        default: ''
      dotnet-version:
        description: .NET SDK version the project commands need
        type: string
        default: ''
      global-json-file:
        description: global.json that names the .NET SDK the project commands need
        type: string
        default: ''
      sentry-org:
        description: Sentry organization slug
        type: string
        required: true
      bot-client-id:
        description: Client ID of the GitHub App that opens the pull requests
        type: string
        required: true
      anthropic-federation-rule-id:
        type: string
        default: ''
      anthropic-organization-id:
        type: string
        default: ''
      anthropic-service-account-id:
        type: string
        default: ''
      anthropic-workspace-id:
        type: string
        default: ''
    secrets:
      sentry-token:
        required: true
      typesafe-api-key:
        required: true
      claude-code-oauth-token:
        required: true
      bot-app-private-key:
        required: true

permissions: {}

jobs:
  plan:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      issues: ${{ steps.plan.outputs.issues }}
      count: ${{ steps.plan.outputs.count }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: Plan the issues to attempt
        id: plan
        uses: oncoursesystems/workflows/.github/actions/sentry-fix-plan@main
        with:
          github-token: ${{ github.token }}
          sentry-token: ${{ secrets.sentry-token }}
          sentry-org: ${{ inputs.sentry-org }}
          typesafe-api-key: ${{ secrets.typesafe-api-key }}
          config-path: ${{ inputs.config-path }}
          dry-run: ${{ inputs.dry-run }}

  fix:
    needs: plan
    if: needs.plan.outputs.count != '' && needs.plan.outputs.count != '0'
    name: fix ${{ matrix.issue.context.issue.shortId }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        issue: ${{ fromJSON(needs.plan.outputs.issues) }}
    steps:
      - name: Check out the planned commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Fix the issue
        uses: oncoursesystems/workflows/.github/actions/sentry-fix-run@main
        with:
          issue: ${{ toJSON(matrix.issue) }}
          out-dir: ${{ runner.temp }}/sentry-fix/${{ matrix.issue.context.issue.id }}
          claude-code-oauth-token: ${{ secrets.claude-code-oauth-token }}
          anthropic-federation-rule-id: ${{ inputs.anthropic-federation-rule-id }}
          anthropic-organization-id: ${{ inputs.anthropic-organization-id }}
          anthropic-service-account-id: ${{ inputs.anthropic-service-account-id }}
          anthropic-workspace-id: ${{ inputs.anthropic-workspace-id }}
          node-version: ${{ inputs.node-version }}
          dotnet-version: ${{ inputs.dotnet-version }}
          global-json-file: ${{ inputs.global-json-file }}

      - name: Keep the result for the publish job
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sentry-fix-${{ matrix.issue.context.issue.id }}
          path: ${{ runner.temp }}/sentry-fix/${{ matrix.issue.context.issue.id }}
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [plan, fix]
    if: ${{ !cancelled() && needs.plan.outputs.count != '' && needs.plan.outputs.count != '0' }}
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - name: Download the fixer results
        uses: actions/download-artifact@v8
        with:
          pattern: sentry-fix-*
          path: ${{ runner.temp }}/sentry-fix

      - name: Publish the results
        uses: oncoursesystems/workflows/.github/actions/sentry-fix-publish@main
        with:
          results-dir: ${{ runner.temp }}/sentry-fix
          bot-client-id: ${{ inputs.bot-client-id }}
          bot-app-private-key: ${{ secrets.bot-app-private-key }}
          sentry-token: ${{ secrets.sentry-token }}
          sentry-org: ${{ inputs.sentry-org }}
          config-path: ${{ inputs.config-path }}
