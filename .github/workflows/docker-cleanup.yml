name: docker-cleanup

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: k8s-linux
      package-name:
        type: string
        default: ${{ github.event.repository.name }}

jobs:
  release:
    runs-on: ${{ inputs.runs-on }}
    steps:
      # actions/delete-package-versions@v5 is NOT safe with BuildX OCI image
      # indexes — it treats per-platform manifests as "untagged" and deletes
      # them, breaking the tagged index. This action is OCI-index-aware.
      - name: Delete untagged packages
        uses: dataaxiom/ghcr-cleanup-action@v1.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: ${{ inputs.package-name }}
          delete-untagged: true
