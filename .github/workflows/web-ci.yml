name: web-ci

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: linux
      runs-on-windows:
        type: string
        default: windows
      sparse-checkout:
        type: string
        required: false
      dotnet-version:
        type: string
        default: 8.0.x
      dotnet-project-path:
        type: string
        required: false
      dotnet-framework-project-path:
        type: string
        required: false
      dotnet-project-file:
        type: string
        required: false
      bun-version:
        type: string
        default: latest
      nodejs-version:
        type: string
        default: 20.x
      nodejs-project-path:
        type: string
        required: false
      dotnet-locked-mode:
        type: boolean
        default: false
      install-secrets:
        description: >-
          Newline-delimited "<ENV_NAME>=<SECRET_NAME>" lines. Each named caller secret is set as that environment
          variable for the Node.js install. Needs the caller to pass secrets: inherit.
        type: string
        default: ''

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  CI: 1

jobs:
  build-nodejs:
    if: inputs.nodejs-project-path != ''
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: ${{ inputs.sparse-checkout }}

      - name: ⚙️ Setup NodeJS
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: 🏦 Cache dependencies
        id: cache-bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles(format('{0}/bun.lock', inputs.nodejs-project-path)) }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📦 Install dependencies
        working-directory: ${{ inputs.nodejs-project-path }}
        env:
          INSTALL_SECRETS: ${{ inputs.install-secrets }}
          # A secret named at runtime has no static secrets.<name> reference, so this step alone
          # reads the whole secrets context, and only when the caller opts in.
          SECRETS_JSON: ${{ inputs.install-secrets != '' && toJSON(secrets) || '' }}
        run: |
          while read -r line; do
            [ -n "$line" ] || continue
            env_name="${line%%=*}"
            name="${line#*=}"
            if [[ "$line" != *=* || ! "$env_name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ || ! "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              echo "::error::install-secrets line '$line' must look like <ENV_NAME>=<SECRET_NAME>"
              exit 1
            fi
            value="$(jq -jn --arg name "${name^^}" \
              'env.SECRETS_JSON | fromjson | with_entries(.key |= ascii_upcase) | .[$name] // ""')"
            if [ -z "$value" ]; then
              echo "::error::Secret $name is missing or empty. The caller must pass secrets: inherit and see the secret."
              exit 1
            fi
            export "$env_name=$value"
          done <<< "$INSTALL_SECRETS"
          unset SECRETS_JSON
          bun install --frozen-lockfile

      - name: 🚀 Bun run build
        working-directory: ${{ inputs.nodejs-project-path }}
        run: bun run build

  build-dotnet-core:
    if: inputs.dotnet-project-path != ''
    runs-on: ${{ inputs.runs-on }}
    env:
      # Linux-only. The k8s runners cannot write to the default SDK location,
      # and these paths are meaningless on the Windows framework runners.
      DOTNET_INSTALL_DIR: "./.dotnet"
      DOTNET_CLI_HOME: "/tmp"
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: ${{ inputs.sparse-checkout }}

      - name: ⚙️ Setup Dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          cache: true
          cache-dependency-path: ${{ inputs.dotnet-project-path }}/**/*.csproj

      - name: 📦 Dotnet restore (locked mode)
        if: inputs.dotnet-locked-mode
        working-directory: ${{ inputs.dotnet-project-path }}
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet restore --locked-mode

      - name: 🚀 Dotnet build
        working-directory: ${{ inputs.dotnet-project-path }}
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet build --nologo --configuration Release ${{ inputs.dotnet-locked-mode && '--no-restore' || '' }}

  build-dotnet-framework:
    if: inputs.dotnet-framework-project-path != ''
    runs-on: ${{ inputs.runs-on-windows }}
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: ${{ inputs.sparse-checkout }}

      # The solution mixes .NET Framework projects with SDK-style ones, so
      # restore has to resolve Microsoft.NET.Sdk. MSBuild finds that through a
      # real .NET SDK on PATH, not through Visual Studio Build Tools, and the
      # version has to satisfy global.json or the resolve fails outright.
      - name: ⚙️ Setup Dotnet
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: ⚙️ Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: ⚙️ Setup Nuget
        uses: nuget/setup-nuget@v4

      - name: 📦 Restore packages
        working-directory: ${{ inputs.dotnet-framework-project-path }}
        run: nuget restore ${{ inputs.dotnet-project-file }} ${{ inputs.dotnet-locked-mode && '-LockedMode' || '' }}

      - name: 🚀 Dotnet build
        working-directory: ${{ inputs.dotnet-framework-project-path }}
        run: msbuild ${{ inputs.dotnet-project-file }} /nologo /nr:false /p:platform="Any CPU" /p:configuration="Release"