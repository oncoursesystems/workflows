name: web-ci

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: k8s-linux
      runs-on-windows:
        type: string
        default: self-hosted
      sparse-checkout:
        type: string
        required: false
      dotnet-version:
        type: string
        default: 8.0.x
      # dotnet (SDK/"core") project path. Set to run the dotnet-core build; leave unset to skip it.
      dotnet-project-path:
        type: string
        required: false
      # dotnet Framework project path (working directory for nuget/msbuild). Set to run the
      # Framework build; leave unset to skip it.
      dotnet-framework-project-path:
        type: string
        required: false
      # Solution or project file for the Framework build (relative to dotnet-framework-project-path).
      dotnet-project-file:
        type: string
        required: false
      bun-version:
        type: string
        default: latest
      nodejs-version:
        type: string
        default: 20.x
      # NodeJS project path. Set to run the node build; leave unset to skip it.
      nodejs-project-path:
        type: string
        required: false
      dotnet-locked-mode:
        type: boolean
        default: false

env:
  DOTNET_INSTALL_DIR: "./.dotnet" # Needed otherwise dotnet setup will fail due to permissions on the k8s runner
  DOTNET_CLI_HOME: "/tmp"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1 # Suppresses the "Welcome to .NET!" message
  CI: 1 # Disables Husky and prevents npm install running during the dotnet build

# Each build job is opted into explicitly by supplying its project path. No globbing is used
# to auto-detect projects: a job runs only when its `*-project-path` input is non-empty, and
# builds exactly that path. This avoids silent skips (a missing/unmatched glob used to pass the
# job green without building anything) and unrelated matches (e.g. Sencha package.json files).
jobs:
  build-nodejs:
    if: inputs.nodejs-project-path != ''
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: ${{ inputs.sparse-checkout }}

      - name: ⚙️ Setup NodeJS
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: 🏦 Cache dependencies
        id: cache-bun
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles(format('{0}/bun.lock', inputs.nodejs-project-path)) }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📦 Install dependencies
        working-directory: ${{ inputs.nodejs-project-path }}
        run: bun install --frozen-lockfile

      - name: 🚀 Bun run build
        working-directory: ${{ inputs.nodejs-project-path }}
        run: bun run build

  build-dotnet-core:
    if: inputs.dotnet-project-path != ''
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: ${{ inputs.sparse-checkout }}

      - name: ⚙️ Setup Dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          cache: true
          cache-dependency-path: ${{ inputs.dotnet-project-path }}/**/*.csproj

      - name: 📦 Dotnet restore (locked mode)
        if: inputs.dotnet-locked-mode
        working-directory: ${{ inputs.dotnet-project-path }}
        # Feeds a private GitHub Packages source (nuget.pkg.github.com) when a repo's
        # nuget.config references %GITHUB_PACKAGES_TOKEN%. Harmless for repos that don't
        # (the env var is simply unused). Needs packages:read in the caller's permissions.
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet restore --locked-mode

      - name: 🚀 Dotnet build
        if: inputs.dotnet-project-path != ''
        working-directory: ${{ inputs.dotnet-project-path }}
        # Also set for the build step so non-locked-mode consumers (which restore during
        # build) can still authenticate to the private feed.
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet build --nologo --configuration Release ${{ inputs.dotnet-locked-mode && '--no-restore' || '' }}

  build-dotnet-framework:
    if: inputs.dotnet-framework-project-path != ''
    runs-on: ${{ inputs.runs-on-windows }}
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: ${{ inputs.sparse-checkout }}

      - name: ⚙️ Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: ⚙️ Setup Nuget
        uses: nuget/setup-nuget@v4

      - name: 📦 Restore packages
        working-directory: ${{ inputs.dotnet-framework-project-path }}
        run: nuget restore ${{ inputs.dotnet-project-file }} ${{ inputs.dotnet-locked-mode && '-LockedMode' || '' }}

      - name: 🚀 Dotnet build
        working-directory: ${{ inputs.dotnet-framework-project-path }}
        run: msbuild ${{ inputs.dotnet-project-file }} /nologo /nr:false /p:platform="Any CPU" /p:configuration="Release"
