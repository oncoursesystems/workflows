name: web-ci

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: k8s-linux
      runs-on-windows:
        type: string
        default: self-hosted
      sparse-checkout:
        type: string
        required: false
      dotnet-version:
        type: string
        default: 8.0.x
      dotnet-project-path:
        type: string
        required: false
        default: .
      dotnet-project-file:
        type: string
        required: false
      bun-version:
        type: string
        required: false
        default: latest
      nodejs-version:
        type: string
        required: false
        default: 20.x
      nodejs-project-path:
        type: string
        required: false
        default: .
      dotnet-locked-mode:
        type: boolean
        required: false
        default: false

env:
  DOTNET_INSTALL_DIR: "./.dotnet" # Needed otherwise dotnet setup will fail due to permissions on the k8s runner
  DOTNET_CLI_HOME: "/tmp" 
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1 # Suppresses the "Welcome to .NET!" message
  CI: 1 # Disables Husky and prevents npm install running during the dotnet build

jobs:
  build-nodejs:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: ${{ inputs.sparse-checkout }}

      - name: 🧪 Test for NodeJS
        id: test
        uses: andstor/file-existence-action@v3
        with:
          # Gate on package.json at the node project root, not "**/package.json".
          # The recursive glob matches unrelated files (e.g. Sencha package.json
          # descriptors) and triggers `bun install` in a directory with no lockfile.
          files: "${{ inputs.nodejs-project-path }}/package.json"
          ignore_case: true

      - name: ⚙️ Setup NodeJS
        if: steps.test.outputs.files_exists == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: 🏦 Cache dependencies
        if: steps.test.outputs.files_exists == 'true'
        id: cache-bun
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles(format('{0}/bun.lock', inputs.nodejs-project-path)) }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📦 Install dependencies
        if: steps.test.outputs.files_exists == 'true'
        working-directory: ${{ inputs.nodejs-project-path }}
        run: bun install --frozen-lockfile

      - name: 🚀 Bun run build
        if: steps.test.outputs.files_exists == 'true'
        working-directory: ${{ inputs.nodejs-project-path }}
        run: bun run build

  build-dotnet-core:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: ${{ inputs.sparse-checkout }}

      - name: 🧪 Test for Dotnet Core
        id: test
        uses: andstor/file-existence-action@v3
        with:
          files: "**/*.csproj, **/appSettings.json"
          ignore_case: true

      - name: ⚙️ Setup Dotnet
        if: steps.test.outputs.files_exists == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: 📦 Dotnet restore (locked mode)
        if: steps.test.outputs.files_exists == 'true' && inputs.dotnet-locked-mode
        working-directory: ${{ inputs.dotnet-project-path }}
        # Feeds a private GitHub Packages source (nuget.pkg.github.com) when a repo's
        # nuget.config references %GITHUB_PACKAGES_TOKEN%. Harmless for repos that don't
        # (the env var is simply unused). Needs packages:read in the caller's permissions.
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet restore --locked-mode

      - name: 🚀 Dotnet build
        if: steps.test.outputs.files_exists == 'true'
        working-directory: ${{ inputs.dotnet-project-path }}
        # Also set for the build step so non-locked-mode consumers (which restore during
        # build) can still authenticate to the private feed.
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet build --nologo --configuration Release ${{ inputs.dotnet-locked-mode && '--no-restore' || '' }}

  build-dotnet-framework:
    runs-on: ${{ inputs.runs-on-windows }}
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: ${{ inputs.sparse-checkout }}

      - name: 🧪 Test for Dotnet Framework
        id: test
        uses: andstor/file-existence-action@v3
        with:
          files: "**/*.csproj, **/Web.config"
          ignore_case: true

      - name: ⚙️ Setup MSBuild
        if: steps.test.outputs.files_exists == 'true'
        uses: microsoft/setup-msbuild@v3

      - name: ⚙️ Setup Nuget
        if: steps.test.outputs.files_exists == 'true'
        uses: nuget/setup-nuget@v4

      - name: 📦 Restore packages
        if: steps.test.outputs.files_exists == 'true'
        working-directory: ${{ inputs.dotnet-project-path }}
        run: nuget restore ${{ inputs.dotnet-project-file }}

      - name: 🚀 Dotnet build
        if: steps.test.outputs.files_exists == 'true'
        working-directory: ${{ inputs.dotnet-project-path }}
        run: msbuild.exe ${{ inputs.dotnet-project-file }} /nologo /nr:false /p:platform="Any CPU" /p:configuration="Release"
