name: claude-pr-review

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: k8s-linux
      anthropic-model:
        type: string
        description: "Claude model to use (e.g., claude-opus-4-5, claude-sonnet-4-6)"
        required: false
        default: "claude-sonnet-4-6"
      prompt-file:
        type: string
        description: "Path to a markdown file containing review instructions (read by Claude at runtime)"
        required: false
        default: ""
      fetch-depth:
        type: number
        description: "Git fetch depth (0 = full history, 1 = shallow)"
        required: false
        default: 1
      custom-prompt:
        type: string
        description: "Additional custom instructions for the review"
        required: false
        default: ""
      allowed-tools:
        type: string
        description: "Tools allowed for Claude to use"
        required: false
        default: "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
      bun-path:
        type: string
        description: "Path to pre-installed Bun runtime (leave blank to let Claude install Bun)"
        required: false
        default: /home/runner/.bun/bin/bun
      show-full-output:
        type: string
        description: "Show full Claude output (tool calls, results) in the Actions log. May expose sensitive data - debug only."
        required: false
        default: "false"
    secrets:
      CLAUDE_TOKEN:
        description: "Claude Code OAuth token"
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Run Claude PR Review
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_MODEL: ${{ inputs.anthropic-model }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_TOKEN }}
          path_to_bun_executable: ${{ inputs.bun-path }}
          show_full_output: ${{ inputs.show-full-output }}
          use_sticky_comment: true
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            ${{ inputs.prompt-file != '' && format('Read the file `{0}` for your review instructions.', inputs.prompt-file) || 'Review this pull request for correctness, security, and significant improvements. Skip style nits.' }}

            RULES:
            - If this is a new PR, review all commits in this branch. If this is an update, only review the new commits.
            - Check existing code comments and update before creating new ones for the same code lines.
            - If a code comment has been resolved with a recent commit, mark the comment as resolved.

            ${{ inputs.custom-prompt }}

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.
          claude_args: |
            --allowedTools "${{ inputs.allowed-tools }}"
