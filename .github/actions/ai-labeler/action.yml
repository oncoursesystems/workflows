name: AI labeler
description: >
  Label a pull request with the labels a repository defines in a YAML file on
  the default branch. For each label, asks Jev one yes or no question about the
  pull request, then adds the label when the answer is a clear yes and removes
  it when the answer is a clear no.

inputs:
  github-token:
    description: Token used to read the pull request and the config, and to create and set labels.
    required: true
  typesafe-api-key:
    description: TypeSafe API key for Jev.
    required: true
  pull-request:
    description: Number of the pull request to label. Used only when the event is not a pull_request event, such as a workflow_dispatch backfill.
    required: false
  config-path:
    description: Path of the label config, read from the repository's default branch.
    required: false
    default: .github/ai-labeler.yml
  jev-model:
    description: Jev model ID. Pin a version, because the thresholds are calibrated per version.
    required: false
    default: jev-1.14.0

outputs:
  labels:
    description: The labels from the config that are on the pull request after the run, comma-separated.

runs:
  using: node24
  main: dist/index.js
