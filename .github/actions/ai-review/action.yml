name: AI review
description: >
  Review a pull request with Claude bug finders sized by its risk tier, check every candidate with three
  adversarial reviewers, and post the confirmed findings. The ai-review check is neutral, so it blocks nothing.

inputs:
  github-token:
    description: Workflow token. It posts the ai-review check, and the comments too when no bot app is given.
    required: true
  bot-app-id:
    description: ID of the GitHub App that posts the summary and the review comments.
    required: false
  bot-app-private-key:
    description: Private key of that GitHub App.
    required: false
  claude-code-oauth-token:
    description: Claude Code OAuth token the agents run on.
    required: true
  anthropic-federation-rule-id:
    description: >
      Workload identity federation rule (fdrl_...) to fall back on. When the subscription hits a usage limit, the
      rest of the run uses the Claude API through this rule, billed per token to its workspace. The job needs the
      id-token write permission. Without the four federation inputs, a usage limit ends the review with a warning.
    required: false
  anthropic-organization-id:
    description: Anthropic organization ID (a UUID) that owns the federation rule.
    required: false
  anthropic-service-account-id:
    description: Service account (svac_...) the federation rule targets.
    required: false
  anthropic-workspace-id:
    description: Workspace (wrkspc_...) that the API calls are billed to.
    required: false
  api-only:
    description: Skip the subscription and run the whole review on the Claude API. Use it to test the federation setup.
    required: false
    default: 'false'
  pull-request:
    description: Number of the pull request to review. Used only when the event is not a pull_request event.
    required: false
  start-over:
    description: >
      On a workflow_dispatch run, review the whole pull request as round 1. Set it to false to continue from the
      last review instead, which skips a pull request whose head was already reviewed.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Create the bot token
      id: bot
      if: inputs.bot-app-id != '' && inputs.bot-app-private-key != ''
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.bot-app-id }}
        private-key: ${{ inputs.bot-app-private-key }}

    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Install the reviewer
      shell: bash
      working-directory: ${{ github.action_path }}/../../../ai-review
      run: npm ci --omit=dev --no-audit --no-fund

    - name: Review the pull request
      id: review
      shell: bash
      env:
        INPUT_GITHUB-TOKEN: ${{ inputs.github-token }}
        INPUT_BOT-TOKEN: ${{ steps.bot.outputs.token }}
        INPUT_PULL-REQUEST: ${{ inputs.pull-request }}
        INPUT_START-OVER: ${{ inputs.start-over }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        INPUT_ANTHROPIC-FEDERATION-RULE-ID: ${{ inputs.anthropic-federation-rule-id }}
        INPUT_ANTHROPIC-ORGANIZATION-ID: ${{ inputs.anthropic-organization-id }}
        INPUT_ANTHROPIC-SERVICE-ACCOUNT-ID: ${{ inputs.anthropic-service-account-id }}
        INPUT_ANTHROPIC-WORKSPACE-ID: ${{ inputs.anthropic-workspace-id }}
        INPUT_API-ONLY: ${{ inputs.api-only }}
      run: node --experimental-strip-types --no-warnings=ExperimentalWarning "${{ github.action_path }}/../../../ai-review/src/review/action.ts"

    - name: Keep the review record
      if: steps.review.outputs.record != ''
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.review.outputs.record-name }}
        path: ${{ steps.review.outputs.record }}
        retention-days: 90
