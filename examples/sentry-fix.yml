---
# --- .github/sentry-fix.yml (config, on the default branch) -----------------------------------------
limit: 5
environment: production
period: 7d
projects:
  - slug: oncourse-dotnet
    description: The ASP.NET server and its services. Oracle access goes through PL/SQL packages in the database.
    roots: [src]
    commands:
      - dotnet build src/OnCourse.sln -m:2
      - dotnet test src/OnCourse.Tests/OnCourse.Tests.csproj
  - slug: oncourse-web
    description: The ExtJS 7 single page app that teachers and administrators use.
    roots: [client/web]
    commands:
      - npm --prefix client/web ci
      - npm --prefix client/web test
      - npm --prefix client/web run lint
  - slug: oncourse-mobile
    description: The mobile app.
    roots: [client/mobile]
    commands:
      - npm --prefix client/mobile ci
      - npm --prefix client/mobile test
apps:
  - name: web
    release: OnCourse.Web@{version}
    projects: [oncourse-dotnet, oncourse-web]
  - name: mobile
    release: com.oncourse.mobile@{version}
    projects: [oncourse-mobile]
